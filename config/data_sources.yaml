# ---------------------------------------------------------------------------
# D. 宏观
# ---------------------------------------------------------------------------
  - id: macro_pmi
    category: 宏观
    cn_name: 制造业与非制造业 PMI
    en_name: pmi
    interface: macro_china_pmi
    params: {}
    freq: 月
    table: macro_pmi
    key_cols: [stat_month]
    column_map:
      月份: stat_month
      制造业-指数: pmi_manufacturing
      制造业-同比增长: pmi_manufacturing_yoy
      非制造业-指数: pmi_non_manufacturing
      非制造业-同比增长: pmi_non_manufacturing_yoy
    fields: [stat_month, pmi_manufacturing, pmi_manufacturing_yoy, pmi_non_manufacturing, pmi_non_manufacturing_yoy]
    notes: "stat_month 形如『2026年10月份』，为统计月份而非发布日。PMI 于次月首个工作日左右发布，回测须滞后 1 个月使用。"

  - id: macro_cpi
    category: 宏观
    cn_name: CPI
    en_name: cpi
    interface: macro_china_cpi
    params: {}
    freq: 月
    table: macro_cpi
    key_cols: [stat_month]
    column_map:
      月份: stat_month
      全国-当月: cpi_index
      全国-同比增长: cpi_yoy
      全国-环比增长: cpi_mom
      全国-累计: cpi_ytd
    fields: [stat_month, cpi_index, cpi_yoy, cpi_mom, cpi_ytd]
    notes: "无发布日字段；CPI 通常次月中旬发布。"

  - id: macro_ppi
    category: 宏观
    cn_name: PPI
    en_name: ppi
    interface: macro_china_ppi
    params: {}
    freq: 月
    table: macro_ppi
    key_cols: [stat_month]
    column_map:
      月份: stat_month
      当月: ppi_index
      当月同比增长: ppi_yoy
      累计: ppi_ytd
    fields: [stat_month, ppi_index, ppi_yoy, ppi_ytd]
    notes: "周期风格核心指标。无发布日字段，须按统计局发布节奏（次月 9 日左右）滞后使用。"

  - id: macro_money_supply
    category: 宏观
    cn_name: 货币供应量 M0/M1/M2
    en_name: money_supply
    interface: macro_china_money_supply_em
    params: {}
    freq: 月
    table: macro_money_supply
    key_cols: [stat_month]
    column_map:
      月份: stat_month
      货币和准货币(M2)-数量(亿元): m2_amount
      货币和准货币(M2)-同比增长: m2_yoy
      货币(M1)-数量(亿元): m1_amount
      货币(M1)-同比增长: m1_yoy
      流通中的现金(M0)-数量(亿元): m0_amount
      流通中的现金(M0)-同比增长: m0_yoy
    fields: [stat_month, m2_amount, m2_yoy, m1_amount, m1_yoy, m0_amount, m0_yoy]
    notes: "旧名 macro_china_money_supply 已废弃。M1-M2 剪刀差可作为风格轮动的流动性代理变量。"

  - id: macro_social_financing
    category: 宏观
    cn_name: 社会融资规模增量
    en_name: social_financing
    interface: macro_china_social_financing
    params: {}
    freq: 月
    table: macro_social_financing
    key_cols: [stat_month]
    column_map:
      月份: stat_month
      社会融资规模增量: sf_increment
      其中-人民币贷款: sf_rmb_loan
      其中-企业债券: sf_corp_bond
      其中-非金融企业境内股票融资: sf_equity
    fields: [stat_month, sf_increment, sf_rmb_loan, sf_corp_bond, sf_equity]
    notes: "stat_month 为 YYYYMM 字符串。该源最新月份存在滞后/异常排序，入库后须按月份重新排序校验。社融存量同比增速需自行由增量累加计算。"

  - id: macro_industrial_value_added
    category: 宏观
    cn_name: 工业增加值同比
    en_name: industrial_value_added
    interface: macro_china_industrial_value_added
    params: {}
    freq: 月
    table: macro_industrial_value_added
    key_cols: [stat_month]
    column_map:
      月份: stat_month
      同比增长: iva_yoy
      累计增长: iva_ytd
      发布时间: publish_date
    fields: [stat_month, iva_yoy, iva_ytd, publish_date]
    notes: "虽有『发布时间』字段，但实为统计月首日（伪发布日），不可直接当可得日使用。"

  - id: macro_industrial_profit
    category: 宏观
    cn_name: 规模以上工业企业主要经济指标（含利润总额）
    en_name: industrial_profit
    interface: macro_china_nbs_nation
    params: {kind: 月度数据, path: "工业 > 工业企业主要经济指标", period: "2015-"}
    freq: 月
    table: macro_industrial_profit
    key_cols: [indicator, stat_month]
    pivot: {index: indicator, columns: stat_month}
    fields: [indicator, stat_month, value]
    notes: "国家统计局直连。返回为『指标 × 月份』宽表(76 行 × 129 列)，入库前需 unpivot 成长表。含利润总额、营业收入、亏损企业数等。缺陷：无发布日，且部分指标历史为空。"

  - id: macro_fixed_asset_investment
    category: 宏观
    cn_name: 固定资产投资
    en_name: fixed_asset_investment
    interface: macro_china_fixed_asset_investment
    params: {}
    freq: 月
    table: macro_fixed_asset_investment
    key_cols: [stat_month]
    column_map:
      月份: stat_month
      当月: fai_amount
      同比增长: fai_yoy
      环比增长: fai_mom
      自年初累计: fai_ytd
    fields: [stat_month, fai_amount, fai_yoy, fai_mom, fai_ytd]
    notes: "仅自 2012 年起，早期存在空值。"

  - id: macro_bond_yield
    category: 宏观
    cn_name: 中债国债收益率曲线（含 10 年）
    en_name: treasury_yield
    interface: bond_zh_us_yield_em
    params: {}
    freq: 日
    table: macro_bond_yield
    key_cols: [trade_date]
    column_map:
      日期: trade_date
      中国国债收益率2年: cn_2y
      中国国债收益率5年: cn_5y
      中国国债收益率10年: cn_10y
      中国国债收益率30年: cn_30y
      中国国债收益率10年-2年: cn_10y_2y_spread
    fields: [trade_date, cn_2y, cn_5y, cn_10y, cn_30y, cn_10y_2y_spread]
    notes: "1990 年起日频，是红利股『股息率-国债收益率』利差的核心输入。同时含美债收益率，可作为全球利率环境参考。"

  - id: macro_dr007
    category: 宏观
    cn_name: 银行间回购定盘利率（DR007）
    en_name: dr007
    interface: interest_rate_repo_hist_cm
    params: {}
    loop: {param: year, values: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]}
    freq: 日
    table: macro_dr007
    key_cols: [trade_date]
    column_map:
      date: trade_date
      FR001: fr001
      FR007: fr007
      FR014: fr014
      FDR001: fdr001
      FDR007: fdr007
      FDR014: fdr014
    fields: [trade_date, fr001, fr007, fr014, fdr001, fdr007, fdr014]
    notes: "FDR007 为存款类机构 7 天回购定盘利率，即 DR007 的近似。接口限制单次区间不超过 1 年，需按年循环。实测 2015-2016 年 FDR007 全为空，实际起点晚于 2017。"

