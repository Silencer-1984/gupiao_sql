[project]
name = "ashare-dashboard"
version = "1.0.0"
description = "A股风格轮动研究 + 每日市场情绪看板（数据底座 + FastAPI + React）"
requires-python = ">=3.12"
dependencies = [
    "akshare==1.20.65",
    "pandas==3.1.1",
    "pyyaml>=6.0",
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
dash = "server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv]
package = true
