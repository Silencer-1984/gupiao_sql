# E. 资金与交易情绪
# ---------------------------------------------------------------------------
  - id: flow_margin_sse
    category: 资金
    cn_name: 上交所融资融券汇总
    en_name: margin_sse
    interface: stock_margin_sse
    params: {}
    loop: {param: year, values: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]}
    freq: 日
    table: flow_margin_sse
    key_cols: [trade_date]
    column_map:
      信用交易日期: trade_date
      融资余额: margin_balance
      融资买入额: margin_buy
      融券余量: short_volume
      融券余量金额: short_amount
      融券卖出量: short_sell_volume
      融资融券余额: margin_total
    fields: [trade_date, margin_balance, margin_buy, short_volume, short_amount, short_sell_volume, margin_total]
    unit_note: "单位：元"
    notes: "单次查询返回行数有上限（实测约 2000 行，即 8 年左右），故按年循环抓取；仅沪市，需与深市合并得全市场两融。返回的『信用交易日期』为整型(YYYYMMDD)，入库已统一为字符串。"

  - id: flow_margin_szse
    category: 资金
    cn_name: 深交所融资融券（全历史）
    en_name: margin_szse
    interface: stock_margin_szse_js
    params: {}
    freq: 日
    table: flow_margin_szse
    key_cols: [trade_date]
    column_map:
      日期: trade_date
      融资买入额: margin_buy
      融资余额: margin_balance
      融券卖出量: short_sell_volume
      融券余量: short_volume
      融券余额: short_amount
      融资融券余额: margin_total
    fields: [trade_date, margin_buy, margin_balance, short_sell_volume, short_volume, short_amount, margin_total]
    unit_note: "单位：元"
    notes: "一次返回 2010 年至今全历史，优于 stock_margin_szse（后者仅支持单日，且单位为亿元）。注：同为深市两融，两个接口单位口径不同，不可混用。"

  - id: flow_northbound
    category: 资金
    cn_name: 北向资金历史
    en_name: northbound_flow
    interface: stock_hsgt_hist_em
    params: {symbol: 北向资金}
    freq: 日
    table: flow_northbound
    key_cols: [trade_date]
    column_map:
      日期: trade_date
      当日成交净买额: net_buy
      买入成交额: buy_amount
      卖出成交额: sell_amount
      历史累计净买额: net_buy_cum
      沪深300: hs300_close
    fields: [trade_date, net_buy, buy_amount, sell_amount, net_buy_cum, hs300_close]
    notes: "2024-08 起沪深港通停止披露日频净买入，尾部字段大面积为空。历史段（2014-11 至 2024-08）可用，之后不可用，构成结构性断点。"

  - id: flow_szse_summary
    category: 资金
    cn_name: 深交所市场总貌（成交额/流通市值）
    en_name: szse_summary
    interface: stock_summary_szse
    params: {date: "20261120"}
    freq: 快照（单日）
    table: flow_szse_summary
    key_cols: [stat_date, sec_type]
    column_map:
      证券类别: sec_type
      数量: count
      成交金额: amount
      总市值: total_mv
      流通市值: float_mv
    fields: [sec_type, count, amount, total_mv, float_mv]
    notes: "仅支持单日查询，要得到历史序列需逐日循环(2015 年至今约 2600 次)，成本高。可用于校验由指数成交额推算的全市场换手率。上交所对应接口 stock_summary_sse 只返回最近交易日，无历史。"

  - id: flow_etf_scale_sse
    category: 资金
    cn_name: 上交所 ETF 份额
    en_name: etf_scale_sse
    interface: fund_etf_scale_sse
    params: {date: "20261120"}
    freq: 快照（单日）
    table: flow_etf_scale_sse
    key_cols: [fund_code, stat_date]
    column_map:
      基金代码: fund_code
      基金简称: fund_name
      ETF类型: etf_type
      统计日期: stat_date
      基金份额: shares
    fields: [fund_code, fund_name, etf_type, stat_date, shares]
    notes: "单日快照，历史需逐日循环。ETF 份额变化是观察风格资金流入的可靠代理，但无法一次性取得长历史。"

