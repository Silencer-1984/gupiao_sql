    notes: "巨潮接口(stock_dividend_cninfo)对部分股票返回 KeyError: 'records'（实测招商银行/紫金矿业/宝钢失败），新浪接口可作为兜底。缺陷：无报告期字段、无派息日，只能按公告日/除权日定位。"

